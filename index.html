<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MDHTech AI 실습실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}</style>
<style>
/* Layout: 작업표준서(WI) 형식의 실습 문서. 왼쪽 차시 목차, 오른쪽 작업 화면(입력 | 결과). */
:root{
  --bg:#edf0f5; --surface:#ffffff; --surface-2:#f5f7fa; --ink:#121b2b; --muted:#566277;
  --line:#d3dae4; --line-strong:#aeb9c9;
  --accent:#1c4fd8; --accent-ink:#ffffff; --accent-soft:#e3ebff;
  --ok:#0f7a56; --ok-soft:#dff3ea; --warn:#a85a07; --warn-soft:#fbeed8; --bad:#b92f27; --bad-soft:#fbe2df;
  --font:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1522; --surface:#151e2e; --surface-2:#1a2539; --ink:#e7edf7; --muted:#9aa7bc;
    --line:#27344b; --line-strong:#3b4b68;
    --accent:#7ea2ff; --accent-ink:#0b1424; --accent-soft:#1c2b4d;
    --ok:#4fd1a0; --ok-soft:#12352a; --warn:#f0b35a; --warn-soft:#3a2a10; --bad:#ff8a80; --bad-soft:#3d1a18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1522; --surface:#151e2e; --surface-2:#1a2539; --ink:#e7edf7; --muted:#9aa7bc;
  --line:#27344b; --line-strong:#3b4b68;
  --accent:#7ea2ff; --accent-ink:#0b1424; --accent-soft:#1c2b4d;
  --ok:#4fd1a0; --ok-soft:#12352a; --warn:#f0b35a; --warn-soft:#3a2a10; --bad:#ff8a80; --bad-soft:#3d1a18;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--font);
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);gap:28px;max-width:1520px;margin:0 auto;align-items:start}
.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:14px;max-height:calc(100dvh - 32px);overflow:auto;min-width:0}
.brand{display:flex;flex-direction:column;gap:2px;padding:2px 2px 10px;border-bottom:1px solid var(--line)}
.brand .mark{font:600 12px var(--mono);letter-spacing:.08em;color:var(--accent)}
.brand strong{font-size:22px;line-height:1.3;font-weight:700}
.brand small{color:var(--muted);font-size:12.5px}
#nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:var(--r);color:var(--ink);text-decoration:none;border:1px solid transparent}
.nav-item:hover{background:var(--surface)}
.nav-item[aria-current="page"]{background:var(--surface);border-color:var(--line-strong);box-shadow:inset 3px 0 0 var(--accent)}
.nav-item .no{font:500 12px var(--mono);color:var(--muted)}
.nav-item .t{font-size:14px;font-weight:500;word-break:keep-all}
.nav-item .m{font-size:12px;color:var(--muted);white-space:nowrap}
.nav-item.done .m::before{content:"✓ ";color:var(--ok);font-weight:700}
.nav-break{margin:6px 10px;padding:4px 0;border-top:1px dashed var(--line-strong);border-bottom:1px dashed var(--line-strong);font-size:12px;color:var(--muted);text-align:center}
.prog{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
.prog .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent)}
.conn{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.conn .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.conn.ready .dot{background:var(--ok)} .conn.none .dot{background:var(--warn)}
.fine{margin:0;font-size:12px;color:var(--muted);line-height:1.55}
.main{min-width:0;display:flex;flex-direction:column;gap:18px;outline:none}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.stack>*{min-width:0}
.dochead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dochead .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface-2);border-bottom:1px solid var(--line)}
.dochead .meta div{padding:8px 14px;border-right:1px solid var(--line)}
.dochead .meta div:last-child{border-right:0}
.dochead .meta small{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.dochead .meta b{font:500 14px/1.4 var(--mono)}
.dochead .meta b.k{font-family:var(--font);font-weight:600}
.dochead .body{padding:18px 20px 20px}
h1{font-size:28px;line-height:1.3;margin:0 0 10px;font-weight:700;text-wrap:balance;word-break:keep-all}
.lab{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);margin-bottom:2px;letter-spacing:.04em}
.goal{margin:0;max-width:68ch;word-break:keep-all}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel h2,.panel h3{margin:0 0 10px}
.step-h{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:15.5px;font-weight:600}
.step-h .n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 12px var(--mono);flex:none}
.sub{margin:0 0 10px;color:var(--muted);font-size:13.5px;word-break:keep-all}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);margin-left:8px;vertical-align:middle}
textarea,select,input[type=text]{width:100%;font:inherit;font-size:14.5px;line-height:1.6;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--r);padding:10px 12px}
textarea{min-height:84px;resize:vertical}
textarea[readonly]{background:var(--surface);color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:600 14px var(--font);padding:9px 16px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:500 13.5px var(--font);padding:7px 12px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip{font:500 12.5px var(--font);padding:5px 11px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;text-align:left}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.hintlabel{font-size:12.5px;color:var(--muted);margin:12px 0 6px}
.labgrid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.labgrid>div{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:1440px){.labgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.out{border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);min-width:0}
.out-head{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap;border-radius:var(--r) var(--r) 0 0}
.out-label{font-weight:600;font-size:13.5px}
.out-status{font-size:12.5px;color:var(--muted);margin-right:auto}
.out-body{padding:14px 16px;min-height:96px}
.out-body.empty{color:var(--muted)}
.think{color:var(--muted);margin:0}
.md{word-break:keep-all;overflow-wrap:break-word}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:.6em 0}
.md ul,.md ol{margin:.5em 0;padding-left:1.4em}.md li{margin:.2em 0}
.md h3,.md h4{font-size:15.5px;margin:1.1em 0 .4em;font-weight:700}
.md blockquote{margin:.7em 0;padding:2px 12px;border-left:3px solid var(--line-strong);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.md code{font:13px var(--mono);background:var(--surface-2);padding:1px 5px;border-radius:4px}
.tablewrap{overflow-x:auto;margin:.7em 0}
.md table{border-collapse:collapse;font-size:13.5px;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.md th{background:var(--surface-2);font-weight:600;white-space:nowrap}
.code{position:relative;margin:.7em 0}
.code pre{margin:0;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;font:13px/1.55 var(--mono)}
.code pre code{background:none;padding:0;font:inherit}
.code .copy{position:absolute;top:6px;right:6px}
.checks{display:grid;gap:9px;margin:0;padding:0;list-style:none}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;word-break:keep-all}
.checks input{margin-top:5px;width:16px;height:16px;accent-color:var(--accent);flex:none}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--ok-soft);color:var(--ok);margin-left:8px}
.callout{padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink);border:1px solid var(--line);font-size:14px;word-break:keep-all}
.callout.warn{background:var(--warn-soft)}
.formula{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.formula div{padding:12px 14px;border-right:1px solid var(--line);word-break:keep-all}
.formula div:last-child{border-right:0}
.formula b{display:block;font-size:15px;margin-bottom:2px}
.formula span{font-size:13px;color:var(--muted)}
.cols{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
.cols.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.fields{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fields label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.fields small{font-weight:400;color:var(--muted);margin-left:6px}
.ab{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1200px){.ab{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qrow{padding:12px 0;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0;padding-top:0}
.qt{margin:0 0 8px;font-weight:500;word-break:keep-all}
.cbar{display:flex;gap:8px;flex-wrap:wrap}
.cbtn{font:500 13px var(--font);padding:6px 12px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}
.cbtn::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:var(--dotc,var(--muted))}
.cbtn.g{--dotc:var(--ok)}.cbtn.y{--dotc:var(--warn)}.cbtn.r{--dotc:var(--bad)}
.cbtn:disabled{cursor:default;opacity:.55}
.cbtn.right{background:var(--ok-soft);border-color:var(--ok);opacity:1}
.cbtn.wrong{background:var(--bad-soft);border-color:var(--bad);opacity:1}
.cbtn.answer{opacity:1;outline:2px solid var(--ok);outline-offset:1px}
.fb{margin:8px 0 0;font-size:13.5px;word-break:keep-all}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.quiz-sum{margin:12px 0 0;font-weight:600}
.maskbox{padding:14px 16px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);line-height:2.1;word-break:keep-all}
.tok{font:inherit;color:inherit;border:1px dashed var(--line-strong);background:var(--warn-soft);border-radius:4px;padding:0 5px;margin:0 1px;cursor:pointer}
.tok.masked{background:var(--ink);color:var(--surface);border-style:solid;border-color:var(--ink)}
.dtable{border-collapse:collapse;font-size:13.5px;width:100%}
.dtable th,.dtable td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.dtable th{background:var(--surface-2)}
.dtable td.num,.dtable th.num{text-align:right;font-variant-numeric:tabular-nums}
.raw{white-space:pre-wrap;font:13px/1.7 var(--mono);margin:0;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.saved{display:flex;flex-direction:column;gap:10px}
.saved article{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface-2)}
.saved small{color:var(--muted)}
.saved pre{white-space:pre-wrap;margin:6px 0 8px;font:13px/1.6 var(--font);max-height:7.5em;overflow:auto}
.principles{margin:0;padding-left:1.3em}.principles li{margin:.35em 0;word-break:keep-all}
.next{display:flex;justify-content:flex-end}
.next a{font-weight:600;text-decoration:none;padding:10px 16px;border:1px solid var(--accent);border-radius:var(--r)}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.think{animation:pulse 1.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.think{animation:none}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:14px}
  .side{position:static;max-height:none;overflow:visible}
  #nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .nav-item{grid-template-columns:auto auto;white-space:nowrap;background:var(--surface);border-color:var(--line)}
  .nav-item .m{display:none}
  .nav-break,.fine{display:none}
  h1{font-size:23px}
  .formula{grid-template-columns:repeat(2,minmax(0,1fr))}
  .formula div{border-bottom:1px solid var(--line)}
  .cols,.cols.three,.fields{grid-template-columns:minmax(0,1fr)}
  .dochead .meta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dochead .meta div:nth-child(3){grid-column:1/-1;border-top:1px solid var(--line);border-right:0}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="실습 목차">
    <div class="brand"><span class="mark">MDHTech</span><strong>AI 실습실</strong><small>AI 기초실무 · 2026.11.03</small></div>
    <nav id="nav" aria-label="차시"></nav>
    <div class="prog" id="prog"></div>
    <div class="conn" id="conn" role="status"><i class="dot"></i><span>Claude 연결 확인 중</span></div>
    <p class="fine">연습 자료는 모두 가상 예시입니다. 실제 사내 기밀·개인정보는 입력하지 마세요.</p>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<script>
(function(){
'use strict';

/* ---------- 공통 도구 ---------- */
function h(tag, attrs, ...kids){
  const el=document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k==='html') el.innerHTML=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else if(k==='hidden'||k==='value'||k==='checked'||k==='disabled') el[k]=v;
    else el.setAttribute(k,v===true?'':v);
  }
  for(const kid of kids.flat()){
    if(kid==null||kid===false) continue;
    el.append(kid.nodeType?kid:document.createTextNode(kid));
  }
  return el;
}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const LS={
  get(k,d){try{const v=localStorage.getItem('mdh-ai:'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('mdh-ai:'+k,JSON.stringify(v))}catch(e){}}
};
async function copyText(text,btn){
  const label=btn?btn.textContent:'';
  let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true}catch(e){
    try{
      const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(ta);ta.select();
      ok=document.execCommand('copy');ta.remove();
    }catch(e2){}
  }
  if(btn){btn.textContent=ok?'복사됨':'직접 선택해 복사하세요';setTimeout(()=>{btn.textContent=label},1600)}
  return ok;
}
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('[data-copy]');
  if(!b) return;
  const pre=b.parentElement.querySelector('pre');
  if(pre) copyText(pre.textContent,b);
});

/* ---------- 마크다운 (Claude 답변 표시용, HTML은 모두 이스케이프) ---------- */
function inl(s){
  s=esc(s);
  s=s.replace(/&lt;br\s*\/?&gt;/gi,'<br>');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g,'$1<em>$2</em>');
  return s;
}
function cells(line){let t=line.trim();if(t.startsWith('|'))t=t.slice(1);if(t.endsWith('|'))t=t.slice(0,-1);return t.split('|').map(c=>c.trim())}
function codeHtml(t){return '<div class="code"><button type="button" class="btn sm copy" data-copy>복사</button><pre><code>'+esc(t)+'</code></pre></div>'}
function listHtml(items,ordered,start){
  const tag=ordered?'ol':'ul';
  let html='<'+tag+(ordered&&start>1?' start="'+start+'"':'')+'>',open=false;
  items.forEach((it,idx)=>{
    const d=idx===0?0:it.d;
    if(d===0){
      if(open){html+='</ul></li>';open=false}else if(idx>0){html+='</li>'}
      html+='<li>'+inl(it.t);
    }else{
      if(!open){html+='<ul>';open=true}
      html+='<li>'+inl(it.t)+'</li>';
    }
  });
  if(open)html+='</ul></li>';else if(items.length)html+='</li>';
  return html+'</'+tag+'>';
}
function md(src){
  const L=String(src).replace(/\r/g,'').split('\n');const out=[];let i=0;
  const isSep=l=>/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const rowRe=/^\s*\|.*\|\s*$/;
  const listRe=/^\s*([-*•]|\d+[.)])\s+/;
  const special=l=>/^```/.test(l)||/^#{1,4}\s/.test(l)||listRe.test(l)||/^\s*>/.test(l)||rowRe.test(l)||/^\s*(---+|\*\*\*+)\s*$/.test(l);
  while(i<L.length){
    const l=L[i];
    if(!l.trim()){i++;continue}
    if(/^```/.test(l)){
      const buf=[];i++;
      while(i<L.length&&!/^```/.test(L[i])){buf.push(L[i]);i++}
      i++;out.push(codeHtml(buf.join('\n')));continue;
    }
    if(rowRe.test(l)&&i+1<L.length&&isSep(L[i+1])){
      const head=cells(l);i+=2;const rows=[];
      while(i<L.length&&rowRe.test(L[i])){rows.push(cells(L[i]));i++}
      out.push('<div class="tablewrap"><table><thead><tr>'+head.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');
      continue;
    }
    let m=l.match(/^(#{1,4})\s+(.*)$/);
    if(m){out.push((m[1].length<=2?'<h3>':'<h4>')+inl(m[2])+(m[1].length<=2?'</h3>':'</h4>'));i++;continue}
    if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){out.push('<hr>');i++;continue}
    if(/^\s*>/.test(l)){
      const buf=[];
      while(i<L.length&&/^\s*>/.test(L[i])){buf.push(L[i].replace(/^\s*>\s?/,''));i++}
      out.push('<blockquote>'+buf.map(inl).join('<br>')+'</blockquote>');continue;
    }
    if(listRe.test(l)){
      const ordered=/^\s*\d+[.)]\s+/.test(l);
      const first=ordered?parseInt(l.match(/^\s*(\d+)/)[1],10):1;
      const items=[];
      while(i<L.length&&listRe.test(L[i])){
        const mm=L[i].match(/^(\s*)(?:[-*•]|\d+[.)])\s+(.*)$/);
        items.push({d:mm[1].length>=2?1:0,t:mm[2]});i++;
      }
      out.push(listHtml(items,ordered,first));continue;
    }
    const buf=[l];i++;
    while(i<L.length&&L[i].trim()&&!special(L[i])){buf.push(L[i]);i++}
    out.push('<p>'+buf.map(inl).join('<br>')+'</p>');
  }
  return out.join('');
}

function outputPanel(label,{tier='quick'}={}){
  let ctl=null,timer=null,last='';
  const status=h('span',{class:'out-status',role:'status'},'아직 실행 전');
  const stopBtn=h('button',{class:'btn sm',type:'button',hidden:true,onclick:()=>{if(ctl)ctl.abort()}},'중지');
  const copyBtn=h('button',{class:'btn sm',type:'button',hidden:true,onclick:e=>copyText(last,e.currentTarget)},'결과 복사');
  const body=h('div',{class:'out-body md empty'},'실행하면 Claude의 답변이 여기에 표시됩니다.');
  const root=h('section',{class:'out','aria-label':label},
    h('div',{class:'out-head'},h('span',{class:'out-label'},label),status,stopBtn,copyBtn),body);
  async function run(input,tierOv){
    if(ctl) return false;
    if(CONN==='checking'){status.textContent='Claude 연결 확인 중…';await connP}
    if(!SAMPLE){body.className='out-body md';body.innerHTML=fallbackHtml;status.textContent='연결 안 됨';return false}
    const my=new AbortController();ctl=my;
    const t0=Date.now();last='';let started=false,ok=false;
    body.className='out-body md';body.innerHTML='<p class="think">Claude가 생각하는 중…</p>';
    stopBtn.hidden=false;copyBtn.hidden=true;
    const sec=()=>Math.round((Date.now()-t0)/1000);
    const tick=()=>{if(!started)status.textContent='생각하는 중… '+sec()+'초'};
    tick();timer=setInterval(tick,1000);
    try{
      const r=await SAMPLE(input,{modelTier:tierOv||tier,signal:my.signal,cache:false,
        onText:({text})=>{started=true;last=text;body.innerHTML=md(text);status.textContent='작성 중… '+sec()+'초'}});
      last=r.text;body.innerHTML=md(last);
      status.textContent='완료 · '+sec()+'초'+(r.truncated?' · 길이 제한으로 일부가 잘렸습니다':'');
      ok=true;
    }catch(e){
      const code=e&&e.code;
      if(e&&e.text){last=e.text;body.innerHTML=md(last)}
      else{body.className='out-body md empty';body.textContent=code==='cancelled'?'중지했습니다.':'답변을 받지 못했습니다.'}
      status.textContent=errCopy(code);
      if(BLOCK.includes(code)){SAMPLE=null;setConn('none');body.className='out-body md';body.innerHTML=fallbackHtml}
    }finally{
      clearInterval(timer);ctl=null;stopBtn.hidden=true;copyBtn.hidden=!last;
    }
    return ok;
  }
  return {root,run,text:()=>last,busy:()=>!!ctl};
}

function choiceQuiz(items,cats,doneMsg){
  const root=h('div',{class:'quiz'});let answered=0,score=0;
  const sum=h('p',{class:'quiz-sum',role:'status'},'0 / '+items.length+' 선택');
  items.forEach((it,i)=>{
    const fb=h('p',{class:'fb',hidden:true});
    const row=h('div',{class:'qrow'});
    const btns=cats.map((c,ci)=>h('button',{type:'button',class:'cbtn '+(c.cls||''),onclick:()=>pick(ci)},c.label));
    function pick(ci){
      const ok=ci===it.a;answered++;if(ok)score++;
      btns.forEach(b=>{b.disabled=true});
      btns[ci].classList.add(ok?'right':'wrong');
      if(!ok)btns[it.a].classList.add('answer');
      fb.hidden=false;fb.className='fb '+(ok?'ok':'bad');
      fb.textContent=(ok?'맞아요. ':'정답은 「'+cats[it.a].label+'」입니다. ')+it.why;
      sum.textContent=answered<items.length?answered+' / '+items.length+' 선택 · 맞힌 개수 '+score:
        '맞힌 개수 '+score+' / '+items.length+(doneMsg?' · '+doneMsg:'');
      if(answered===items.length&&root.onfinish)root.onfinish();
    }
    row.append(h('p',{class:'qt'},(i+1)+'. '+it.t),h('div',{class:'cbar'},btns),fb);
    root.append(row);
  });
  root.append(sum);
  return root;
}
function miniLab({id,prompt,hints=[],tier='quick',raw=true,label='Claude 답변',onDone,rows=4}){
  const ta=h('textarea',{id,rows,spellcheck:'false'});ta.value=prompt;
  const out=outputPanel(label,{tier});
  const run=h('button',{class:'btn primary',type:'button'},'Claude에게 실행');
  const copy=h('button',{class:'btn',type:'button',onclick:e=>copyText(compose(ta.value,'',true),e.currentTarget)},'프롬프트 복사');
  run.onclick=async()=>{
    if(!ta.value.trim())return;
    run.disabled=true;
    const ok=await out.run(compose(ta.value,'',raw),tier);
    run.disabled=false;if(ok&&onDone)onDone();
  };
  const chips=hints.length?h('div',null,h('p',{class:'hintlabel'},'프롬프트에 한 줄 더 붙여 보기'),
    h('div',{class:'row'},hints.map(t=>h('button',{type:'button',class:'chip',onclick:()=>{
      if(!ta.value.includes(t))ta.value=ta.value.trimEnd()+'\n'+t;ta.focus();
    }},'+ '+t)))):null;
  const root=h('div',{class:'stack'},ta,chips,h('div',{class:'row'},run,copy),out.root);
  return {root,ta,out};
}

const LABST={};
function renderLab(mod){
  const st=LABST[mod.id]||(LABST[mod.id]={si:0,edits:{}});
  const root=h('div',{class:'stack'});root.append(docHead(mod));
  const seg=h('div',{class:'seg',role:'group','aria-label':'상황 선택'});
  const matLabel=h('span',null);
  const mat=h('textarea',{id:mod.id+'-material',spellcheck:'false'});
  const pro=h('textarea',{id:mod.id+'-prompt',rows:6,spellcheck:'false'});
  const sc=()=>mod.scenarios[st.si];
  const fit=()=>{mat.rows=Math.min(15,Math.max(4,mat.value.split('\n').length+1));pro.rows=Math.min(12,Math.max(5,pro.value.split('\n').length+2))};
  const keep=()=>{st.edits[st.si]={material:mat.value,prompt:pro.value}};
  mat.addEventListener('input',keep);pro.addEventListener('input',keep);
  const segBtns=mod.scenarios.map((s,i)=>h('button',{type:'button','aria-pressed':String(i===st.si),onclick:()=>{st.si=i;load()}},s.name));
  segBtns.forEach(b=>seg.append(b));
  function load(){
    const s=sc(),e=st.edits[st.si];
    mat.value=e?e.material:s.material;pro.value=e?e.prompt:s.prompt;
    matLabel.textContent=s.matLabel||mod.matLabel||'업무 자료';
    segBtns.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===st.si)));
    fit();
  }
  const out=outputPanel('Claude 답변',{tier:mod.tier});
  const run=h('button',{class:'btn primary',type:'button'},'Claude에게 실행');
  const copy=h('button',{class:'btn',type:'button',onclick:e=>copyText(compose(pro.value,mat.value,true),e.currentTarget)},'프롬프트 복사');
  const save=h('button',{class:'btn',type:'button',onclick:e=>savePrompt(modLabel(mod),sc().name,pro.value,e.currentTarget)},'모음에 저장');
  const reset=h('button',{class:'btn',type:'button',onclick:()=>{delete st.edits[st.si];load()}},'처음 상태로');
  run.onclick=async()=>{
    if(!pro.value.trim())return;
    run.disabled=true;
    const ok=await out.run(compose(pro.value,mat.value,mod.raw),mod.tier);
    run.disabled=false;if(ok)markDone(mod.id);
  };
  const hintRow=h('div',{class:'row'},mod.hints.map(t=>h('button',{type:'button',class:'chip',onclick:()=>{
    if(!pro.value.includes(t))pro.value=pro.value.trimEnd()+'\n'+t;keep();fit();pro.focus();
  }},'+ '+t)));
  const checkBadge=h('span',{class:'badge',hidden:true},'검수 완료');
  const boxes=mod.check.map((t,i)=>h('input',{type:'checkbox',id:mod.id+'-c'+i}));
  boxes.forEach(b=>b.addEventListener('change',()=>{checkBadge.hidden=!boxes.every(x=>x.checked)}));
  const checks=h('ul',{class:'checks'},mod.check.map((t,i)=>h('li',null,h('label',{for:mod.id+'-c'+i},boxes[i],h('span',null,t)))));
  let n=1;
  const left=h('div',null);
  if(mod.scenarios.length>1)left.append(h('section',{class:'panel'},stepH(n++,'상황 고르기'),seg));
  left.append(h('section',{class:'panel'},
    h('h2',{class:'step-h'},h('span',{class:'n'},String(n++)),matLabel,h('span',{class:'tag'},'가상 예시 자료')),
    h('p',{class:'sub'},'자료는 직접 고쳐 써도 됩니다. 고친 내용은 이 상황을 다시 고를 때까지 유지됩니다.'),mat));
  left.append(h('section',{class:'panel'},stepH(n++,'프롬프트 다듬고 실행'),pro,
    h('p',{class:'hintlabel'},'한 줄 더 붙여 보기'),hintRow,
    h('div',{class:'row',style:'margin-top:14px'},run,copy,save,reset)));
  const right=h('div',null,out.root,
    h('section',{class:'panel'},stepH(n++,'결과 검수',checkBadge),
      h('p',{class:'sub'},'AI의 답은 초안입니다. 쓰기 전에 아래를 확인하세요.'),checks));
  if(mod.extra){const ex=mod.extra(n);if(ex)right.append(ex)}
  root.append(h('div',{class:'labgrid'},left,right));
  load();
  const nx=nextLink(mod);if(nx)root.append(nx);
  return root;
}

  quiz.onfinish=()=>{partsDone.b=true;check()};
  root.append(h('section',{class:'panel'},stepH(2,'보안 신호등: 이 정보, 넣어도 될까?'),
    h('p',{class:'sub'},'일반적인 기준입니다. 실제 업무에서는 MDHTech의 정보보안 규정이 항상 우선합니다.'),quiz));
  // C
  const state=MASK_SEGS.map(s=>typeof s==='string'?null:{on:false});
  const sum=h('p',{class:'quiz-sum',role:'status'});
  const box=h('div',{class:'maskbox'});
  const plain=()=>MASK_SEGS.map((s,i)=>typeof s==='string'?s:(state[i].on?s.m:s.w)).join('');
  const update=()=>{
    let good=0,bad=0,total=0;
    MASK_SEGS.forEach((s,i)=>{if(typeof s==='string')return;if(s.s){total++;if(state[i].on)good++}else if(state[i].on)bad++});
    sum.textContent='가린 민감정보 '+good+' / '+total+(bad?' · 가릴 필요 없는 곳을 가린 것 '+bad+'개':'');
    if(good===total&&bad===0){partsDone.c=true;sum.textContent+=' · 완성';check()}
  };
  MASK_SEGS.forEach((s,i)=>{
    if(typeof s==='string'){box.append(s);return}
    const b=h('button',{type:'button',class:'tok','aria-pressed':'false',onclick:()=>{
      state[i].on=!state[i].on;b.classList.toggle('masked',state[i].on);b.setAttribute('aria-pressed',String(state[i].on));
      b.textContent=state[i].on?s.m:s.w;update();
    }},s.w);
    box.append(b);
  });
  update();
  const cp=h('button',{class:'btn',type:'button',onclick:e=>copyText(plain(),e.currentTarget)},'가린 문장 복사');
  const rs=h('button',{class:'btn',type:'button',onclick:()=>{state.forEach(s=>{if(s)s.on=false});box.querySelectorAll('.tok').forEach((b,k)=>{b.classList.remove('masked');b.setAttribute('aria-pressed','false')});
    let k=0;MASK_SEGS.forEach(s=>{if(typeof s!=='string'){box.querySelectorAll('.tok')[k].textContent=s.w;k++}});update()}},'처음으로');
  root.append(h('section',{class:'panel'},stepH(3,'가려서 입력하기'),
    h('p',{class:'sub'},'AI에게 맡기기 전에 가려야 할 곳을 눌러서 가려 보세요. 가릴 필요가 없는 곳을 누르면 감점입니다. 아래 문장은 모두 가상입니다.'),
    box,sum,h('div',{class:'row',style:'margin-top:10px'},cp,rs)));
  const nx=nextLink(mod);if(nx)root.append(nx);
  return root;
}

/* ---------- 09 내 업무에 적용하기 ---------- */
function renderWrap(mod){
  const root=h('div',{class:'stack'});root.append(docHead(mod));
  const dept=h('select',{id:'m9-dept'},['구매','품질','생산','영업','설비·보전','인사·총무','기타'].map(t=>h('option',{value:t},t)));
  const task=h('textarea',{id:'m9-task',rows:4,spellcheck:'false',placeholder:'예: 매주 월요일 지난주 불량 현황을 엑셀로 정리하고 팀장님께 보고 메일을 씁니다.'});
  const out=outputPanel('내 업무 적용 제안',{tier:'default'});
  const run=h('button',{class:'btn primary',type:'button'},'Claude에게 물어보기');
  run.onclick=async()=>{
    if(!task.value.trim()){task.focus();return}
    run.disabled=true;
    const p='나는 자동차 부품 제조 기업의 '+dept.value+' 부서 직원이다. 아래 반복 업무를 AI(Claude)로 줄이는 방법을 제안해줘.\n업무별로 다음 세 가지를 써줘.\n(1) AI가 도울 수 있는 부분\n(2) 사람이 꼭 확인해야 할 부분\n(3) 오늘 바로 써볼 수 있는 프롬프트 한 개 (복사해서 쓸 수 있게 코드 블록으로)\n입력하면 안 되는 정보가 있다면 먼저 경고해줘. 업무를 지어내지 말고 내가 쓴 것만 다뤄줘.\n\n[내 업무]\n'+task.value.trim();
    const ok=await out.run(PRE+'\n\n'+p,'default');
    run.disabled=false;if(ok)markDone(mod.id);
  };
  root.append(h('section',{class:'panel'},stepH(1,'내 업무 한 가지 적기'),
    h('div',{class:'fields'},h('div',null,h('label',{for:'m9-dept'},'부서'),dept)),
    h('div',{style:'margin-top:12px'},h('label',{for:'m9-task',style:'display:block;font-size:13px;font-weight:600;margin-bottom:4px'},'자주 반복하는 업무'),task),
    h('div',{class:'row',style:'margin-top:12px'},run),
    h('div',{style:'margin-top:14px'},out.root)));
  const list=h('div',{class:'saved'});
  const renderSaved=()=>{
    list.innerHTML='';
    if(!saved.length){list.append(h('p',{class:'sub'},'아직 저장한 프롬프트가 없습니다. 실습 화면에서 \'모음에 저장\'을 누르면 여기에 쌓입니다.'));return}
    saved.forEach(s=>{
      const pre=h('pre',null,s.text);
      list.append(h('article',null,h('small',null,s.mod+' · '+s.name),pre,
        h('div',{class:'row'},
          h('button',{class:'btn sm',type:'button',onclick:e=>copyText(s.text,e.currentTarget)},'복사'),
          h('button',{class:'btn sm',type:'button',onclick:()=>{saved=saved.filter(x=>x.id!==s.id);LS.set('saved',saved);renderSaved()}},'삭제'))));
    });
  };
  renderSaved();
  const all=h('button',{class:'btn',type:'button',onclick:e=>copyText(saved.map(s=>'### '+s.mod+' · '+s.name+'\n'+s.text).join('\n\n'),e.currentTarget)},'전체 복사');
  root.append(h('section',{class:'panel'},stepH(2,'내 프롬프트 모음'),
    h('p',{class:'sub'},'이 브라우저에 저장됩니다. 가져갈 때는 \'전체 복사\'로 메모장이나 메일에 붙여 두세요.'),all,h('div',{style:'margin-top:12px'},list)));
  root.append(h('section',{class:'panel'},h('h3',null,'오늘의 다섯 가지 원칙'),
    h('ol',{class:'principles'},
      h('li',null,'역할·상황·요청·형식을 쓰면 답이 달라집니다.'),
      h('li',null,'숫자, 날짜, 이름은 원문과 직접 대조합니다.'),
      h('li',null,'AI가 내놓은 원인은 후보입니다. 확인은 현장에서 합니다.'),
      h('li',null,'기밀과 개인정보는 넣지 않습니다. 필요하면 가려서 넣습니다.'),
      h('li',null,'결과는 사람이 읽고 책임지고 보냅니다.'))));
  return root;
}

/* ---------- 목차와 라우터 ---------- */
function renderNav(){
  const nav=document.getElementById('nav');nav.innerHTML='';
  MODS.forEach((m,i)=>{
    const a=h('a',{class:'nav-item'+(done.has(m.id)?' done':''),href:'#'+m.id,'aria-current':m.id===current?'page':null},
      h('span',{class:'no'},m.no),h('span',{class:'t'},m.title),h('span',{class:'m'},m.min+'분'));
    nav.append(a);
    if(m.id==='m4')nav.append(h('div',{class:'nav-break'},'휴식 10분'));
  });
  const n=MODS.filter(m=>done.has(m.id)).length;
  const p=document.getElementById('prog');
  p.innerHTML='<div class="bar"><i style="width:'+Math.round(n/MODS.length*100)+'%"></i></div><span>'+n+' / '+MODS.length+' 차시 완료</span>';
}
let current='m0';
function view(mod){
  switch(mod.kind){
    case 'intro':return renderIntro(mod);
    case 'builder':return renderBuilder(mod);
    case 'lab':return renderLab(mod);
    case 'safety':return renderSafety(mod);
    default:return renderWrap(mod);
  }
}
function go(){
  const id=(location.hash||'#m0').slice(1);
  const mod=MODS.find(m=>m.id===id)||MODS[0];
  current=mod.id;renderNav();
  const main=document.getElementById('main');
  main.replaceChildren(view(mod));
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',go);
updateConn();go();
})();
</script>
